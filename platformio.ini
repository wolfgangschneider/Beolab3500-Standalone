; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; This repo holds two separate firmwares sharing parts of src/common/ -
; see README.md's "Project structure":
;   - Beolab3500-Standalone (src/main-standalone.cpp + all of
;     src/common/ + optionally src/BL3500-Standalone/) - the
;     "standalone_*" envs below.
;   - Beolab3500-PL2PL (src/main-pl2pl.cpp, uses only a plain
;     common/BusWriter - not MclBusWriter/PlBusWriter/MclData) - the
;     "pl2pl_*" envs further down.
; Each env's build_src_filter excludes the other firmware's main file
; and whatever common/ files it doesn't need, so only one
; `setup()`/`loop()` pair ever lands in a given build.

; One firmware handles both Beolab 3500 revisions (confirmed identical
; wire protocol, different frame content - see src/common/ and
; src/main-standalone.cpp's header). Which revision (MK1/MK2) is active
; is auto-detected via GPIO at boot (see setup()), not a build flag.
; The two envs below only pick the *board* (pin numbers differ between
; an esp32_wrover and an m5_stamp_S3 - see the #ifdef block at the top
; of src/main-standalone.cpp).

[platformio]
default_envs = standalone_m5_stamp_S3

[env:standalone_esp32_wrover]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
build_flags =
  -D BOARD_WROOVER
build_src_filter = +<*> -<main-pl2pl.cpp> -<PL2PL/>

; M5Stack Stamp S3 (ESP32-S3, USB-CDC)
[env:standalone_m5_stamp_S3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -D BOARD_M5STAMP_S3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<main-pl2pl.cpp> -<PL2PL/>

; --- Beolab3500-PL2PL: minimal MKII PL trigger board, see src/main-pl2pl.cpp ---
; Uses a plain common/BusWriter directly - its sendSource()/sendVol()/
; sendInit() defaults are harmless no-ops (not pure virtual, see
; BusWriter.hpp), so it's concretely instantiable without pulling in
; MclBusWriter/PlBusWriter/MclData at all. Everything else in common/
; (MclBusWriter, PlBusWriter, MclData, BusReader, GpioOutputs,
; SerialDebugCommands) is Standalone-only, excluded here.

[env:pl2pl_m5_stamp_S3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
  +<*> -<main-standalone.cpp> -<BL3500-Standalone/> -<common/>
  +<common/BusWriter.*>




