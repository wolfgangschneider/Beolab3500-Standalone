; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two protocol variants, one repo: Beolab 3500 Mk1 uses the MCL/PL
; "Datalink" bus (src/mcl_mk1/, src/main_mk1.cpp), Mk2 uses a
; different, pure PowerLink protocol (src/powerlink_mk2/,
; src/main_mk2.cpp - not yet implemented). build_src_filter keeps each
; env compiling only its own protocol's sources plus src/common/.

[env:upesy_wrover]
platform = espressif32
board = upesy_wrover
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<powerlink_mk2/> -<main_mk2.cpp>

;##### additional Libs #####
lib_deps =
  https://github.com/aanban/esp32_beo4

[env:upesy_wrover_mk2]
platform = espressif32
board = upesy_wrover
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<mcl_mk1/> -<main_mk1.cpp>

;##### additional Libs #####
lib_deps =
  https://github.com/aanban/esp32_beo4
