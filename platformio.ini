; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; One firmware handles both Beolab 3500 revisions (confirmed identical
; wire protocol, different frame content - see src/common/ and
; src/main.cpp's header). Which revision (MK1/MK2) is active is
; auto-detected via GPIO at boot (see main.cpp's setup()), not a build
; flag. The two envs below only pick the *board* (pin numbers differ
; between an esp32_wrover and an m5_stamp_S3 - see the #ifdef block at
; the top of src/main.cpp).

[platformio]
default_envs = m5_stamp_S3

[env:esp32_wrover]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
build_flags =
  -D BOARD_WROOVER

; M5Stack Stamp S3 (ESP32-S3, USB-CDC)
[env:m5_stamp_S3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -D BOARD_M5STAMP_S3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1


